# Delivery watch — inventory open PRs; fail if any violate ADR-0001 base policy.
# Refs: #78
name: Delivery watch

on:
  schedule:
    # Daily 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
  # Also when a PR is opened/retargeted to main (fast signal for bot PRs)
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: delivery-watch-${{ github.event_name }}-${{ github.event.pull_request.number || 'repo' }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Open PR hygiene inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inventory open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_WATCH_OUT: reports/delivery-watch
        run: |
          chmod +x scripts/delivery-watch.sh
          bash scripts/delivery-watch.sh

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-watch-${{ github.run_id }}
          path: reports/delivery-watch/
          if-no-files-found: ignore
          retention-days: 30
