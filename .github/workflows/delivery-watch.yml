# Delivery watch — inventory open PRs; fail on base-policy violations or failing checks.
# Refs: #78 #87
name: Delivery watch

on:
  schedule:
    # Daily 12:00 UTC + every 6h for faster signal
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled]
    branches: [main, sandbox]
  # Catch check completions so failing CI on open PRs surfaces without waiting for cron
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["PR Validation - Protocol 3→2→1"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: delivery-watch-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.event.check_suite.head_branch || 'repo' }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Open PR hygiene inventory
    runs-on: ubuntu-latest
    # Avoid recursive noise: skip when this workflow itself is the only signal and
    # the triggering PR Validation was for Delivery watch (not applicable). Always run.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory open PRs + failing checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_WATCH_OUT: reports/delivery-watch
        run: |
          chmod +x scripts/delivery-watch.sh
          bash scripts/delivery-watch.sh

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-watch-${{ github.run_id }}
          path: reports/delivery-watch/
          if-no-files-found: ignore
          retention-days: 30
