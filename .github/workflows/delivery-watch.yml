# Delivery watch — inventory open PRs (ADR-0001 base-policy + check report).
# Not a second CI / not a required status check. Merge gates stay on PR Validation.
# Refs: #78 #87 #91 #110
name: Delivery watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  # Observe after PR Validation — report-only (must not redden the PR under test)
  workflow_run:
    workflows: ["PR Validation - Protocol 3→2→1"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: delivery-watch-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || 'repo' }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Open PR hygiene inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inventory open PRs + failing checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_WATCH_OUT: reports/delivery-watch
          # schedule / workflow_dispatch → HARD_FAIL=1 (base-policy only) via script default
          # workflow_run → HARD_FAIL=0 (report only)
        run: |
          chmod +x scripts/delivery-watch.sh
          bash scripts/delivery-watch.sh

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-watch-${{ github.run_id }}
          path: reports/delivery-watch/
          if-no-files-found: ignore
          retention-days: 30
