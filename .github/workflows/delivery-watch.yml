# Delivery watch — inventory open PRs (base-policy + failing checks on schedule).
# Not a second CI. Agents follow docs/guides/delivery-automation.md (babysit + merge-pr.sh).
# Refs: #78 #87 #91
name: Delivery watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [main, sandbox]
  # After PR Validation completes — inventory signal (AIOS-style workflow_run observe)
  workflow_run:
    workflows: ["PR Validation - Protocol 3→2→1"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: delivery-watch-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'repo' }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Open PR hygiene inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inventory open PRs + failing checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_WATCH_OUT: reports/delivery-watch
        run: |
          chmod +x scripts/delivery-watch.sh
          bash scripts/delivery-watch.sh

      - name: Upload inventory artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-watch-${{ github.run_id }}
          path: reports/delivery-watch/
          if-no-files-found: ignore
          retention-days: 30
