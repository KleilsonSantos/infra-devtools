name: 'PR Validation - Protocol 3→2→1'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  analyze-pr:
    name: 'Opção 3: Analisar Documentação'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR Content
        run: |
          echo "OPÇÃO 3: ANÁLISE DE DOCUMENTAÇÃO"
          echo "Commits: $(git rev-list --count ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})"
          echo "Files:"
          git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  issue-link:
    name: 'Issue link (Refs/Closes #N)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require Issue reference on PRs to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-pr-issue-link.sh

  validate-formats:
    name: 'Teste 1: Validação de Formatos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Validate YAML files
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable, comments: disable, document-start: disable}}' \
            docker-compose.yml prometheus.yml alerts.yml alertmanager.yml blackbox.yml

      - name: Validate Shell scripts
        run: |
          failed=0
          for script in scripts/*.sh; do
            if bash -n "$script"; then
              echo "OK $(basename "$script")"
            else
              echo "FAIL $(basename "$script")"
              failed=1
            fi
          done
          exit "$failed"

      - name: Validate JSON files
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if python3 -m json.tool "$file" > /dev/null; then
              echo "OK $file"
            else
              echo "FAIL $file"
              failed=1
            fi
          done < <(find . -name '*.json' -not -path './node_modules/*' -print0)
          exit "$failed"

  validate-critical-files:
    name: 'Teste 2: Integridade de Arquivos Críticos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check critical files
        run: |
          critical_files=(
            "docker-compose.yml"
            ".env.development"
            "Makefile"
            "package.json"
            "pytest.ini"
            "sonar-project.properties"
            "scripts/check-pr-issue-link.sh"
            ".github/pull_request_template.md"
          )
          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK $file"
            else
              echo "MISSING $file"
              exit 1
            fi
          done

  unit-tests:
    name: 'Teste 3: Testes Unitários'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: python -m pytest src/tests/unit/ -v --tb=short

  security-scan:
    name: 'Teste 4: Scan de Segurança'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit
        run: |
          python -m pip install bandit
          bandit -r src/ -ll -ii

  code-quality:
    name: 'Teste 5: Code Quality'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Flake8
        run: |
          python -m pip install flake8
          flake8 src/ --max-line-length=127 --exclude=__pycache__,.git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ESLint (when JS/TS sources exist)
        run: |
          mapfile -t sources < <(find . -type f \( -name '*.ts' -o -name '*.js' \) \
            -not -path './node_modules/*' -not -name 'eslint.config.ts' | head -20)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No application JS/TS sources; skipping ESLint"
            exit 0
          fi
          npm install --legacy-peer-deps
          npx eslint . --ext .ts,.js --quiet

  compatibility-test:
    name: 'Teste 6: Compatibilidade'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test database connection
        run: |
          python -m pip install psycopg2-binary
          python -c "
          import psycopg2
          conn = psycopg2.connect(host='localhost', user='postgres', password='test')
          print('PostgreSQL connection OK')
          conn.close()
          "

  environment-validation:
    name: 'Teste 7: Validação de Ambiente'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .env for CI
        uses: ./.github/actions/generate-env
        with:
          env-file-b64: ${{ secrets.ENV_FILE_B64 || '' }}

      - name: Validate environment template exists
        run: |
          test -f .env.development
          if [ -f .env ]; then
            chmod +x scripts/validate-env.sh
            ./scripts/validate-env.sh
          else
            echo ".env not injected (ENV_FILE_B64 unset) — template .env.development present"
          fi

  validation-summary:
    name: 'Resultado: Protocolo 3→2→1'
    runs-on: ubuntu-latest
    needs:
      [
        analyze-pr,
        issue-link,
        validate-formats,
        validate-critical-files,
        unit-tests,
        security-scan,
        code-quality,
        compatibility-test,
        environment-validation,
      ]
    if: always()
    steps:
      - name: Check validation results
        run: |
          echo "PROTOCOLO 3→2→1 VALIDATION SUMMARY"
          echo "analyze-pr: ${{ needs.analyze-pr.result }}"
          echo "issue-link: ${{ needs.issue-link.result }}"
          echo "formats: ${{ needs.validate-formats.result }}"
          echo "critical-files: ${{ needs.validate-critical-files.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "security: ${{ needs.security-scan.result }}"
          echo "quality: ${{ needs.code-quality.result }}"
          echo "compat: ${{ needs.compatibility-test.result }}"
          echo "env: ${{ needs.environment-validation.result }}"

          for r in \
            "${{ needs.analyze-pr.result }}" \
            "${{ needs.issue-link.result }}" \
            "${{ needs.validate-formats.result }}" \
            "${{ needs.validate-critical-files.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.code-quality.result }}" \
            "${{ needs.compatibility-test.result }}" \
            "${{ needs.environment-validation.result }}"
          do
            if [ "$r" != "success" ]; then
              echo "BLOCKED — one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "ALL REQUIRED CHECKS PASSED"
