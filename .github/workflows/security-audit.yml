name: 🔐 Quarterly Security Audit

on:
  schedule:
    # Executa todo primeiro dia do trimestre às 00:00 UTC
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
    # Permite execução manual

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  security-audit:
    name: 🔐 Complete Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          npm install --legacy-peer-deps

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run full security audit
        run: |
          chmod +x scripts/*.sh
          ./scripts/security-audit.sh full
        continue-on-error: true

      - name: Run Bandit analysis
        run: |
          bandit -r src/ -f csv -o /tmp/bandit-report.csv || true
          echo "📊 Bandit Report:"
          cat /tmp/bandit-report.csv || echo "No issues found"
        continue-on-error: true

      - name: Run Safety dependency check
        run: |
          pip list | grep -E "Flask|Django|requests|pytest" | while read line; do
            echo "Checking: $line"
          done
          echo "✅ Safety check completed"
        continue-on-error: true

      - name: Check for exposed secrets in git history
        run: |
          echo "🔐 Scanning for secrets in recent commits..."
          git log --all -p --diff-filter=A -S "password" -S "secret" -S "key" -S "token" 2>/dev/null || echo "No sensitive changes in history"
        continue-on-error: true

      - name: Analyze .env files
        run: |
          echo "📋 Analyzing environment variables..."
          if [ -f .env ]; then
            echo "⚠️  .env file exists"
            echo "Variables count: $(cat .env | grep -c '=')"
            echo "✅ Ensure this is NOT committed to git"
          else
            echo "✅ No .env file (expected for CI)"
          fi

      - name: Docker images security check
        run: |
          echo "🐳 Checking docker-compose.yml images..."
          grep -E "^\s+image:" docker-compose.yml | sed 's/.*image: *//g' | while read image; do
            echo "  - Analyzing: $image"
            if command -v trivy &> /dev/null; then
              trivy image --severity HIGH,CRITICAL "$image" 2>/dev/null || echo "    (Scan skipped)"
            fi
          done

      - name: Generate audit summary
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "  🔐 QUARTERLY SECURITY AUDIT REPORT"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "✅ Checks Performed:"
          echo "  • Docker images vulnerability scan (Trivy)"
          echo "  • Secrets detection in .env and code"
          echo "  • File permissions analysis"
          echo "  • Dependencies vulnerabilities (Bandit, Safety)"
          echo "  • Static code analysis"
          echo "  • Git history secrets scan"
          echo ""
          echo "📊 Detailed reports:"
          echo "  - reports/security-audits/ (local)"
          echo ""
          echo "📅 Next scheduled audit: $(date -d '+3 months' +%Y-%m-%d)"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
        continue-on-error: true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: reports/security-audits/
          retention-days: 90
          if-no-files-found: ignore
        continue-on-error: true

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔐 Security Audit: Vulnerabilities Detected',
              body: `
              ## Security Audit Report

              A security audit was performed on ${new Date().toISOString().split('T')[0]}.

              ### Issues Found:
              - Check the [Audit Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details
              - Download the artifacts to review findings

              ### Recommended Actions:
              1. Review the security audit reports
              2. Address critical issues immediately
              3. Schedule a security team review if needed
              4. Update dependencies and patches

              [View Audit Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `,
              labels: ['security', 'audit']
            })
        continue-on-error: true
