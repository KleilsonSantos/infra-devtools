# Scheduled / manual security checks (honest scope).
#
# PR Validation remains the fail-closed gate for every PR
# (.github/workflows/pr-validation.yml).
# This workflow is additive: Bandit must pass; deep image/host
# audits stay local via scripts/security-audit.sh (not claimed as CI gates).
#
# Refs: #70

name: Security checks (scheduled)

on:
  schedule:
    # First day of each quarter, 00:00 UTC
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  bandit:
    name: Bandit (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit
          bandit -r src/ -ll -ii

  informational-note:
    name: Scope note (informational)
    runs-on: ubuntu-latest
    needs: [bandit]
    steps:
      - name: Document residual local audits
        run: |
          echo "This workflow only enforces Bandit on src/."
          echo "For Docker image / host / permission audits run locally:"
          echo "  bash scripts/security-audit.sh full"
          echo "PR Validation remains the merge gate (formats, unit, Bandit, SemVer, issue-link)."
