# Dependabot — version updates → sandbox (ADR-0001 / AIOS git-workflow).
# Note: Dependabot *security* updates may still target the default branch (main)
# when target-branch is set — prefer alerts + sandbox bumps; close stale main queues.
# Refs: #78 #91
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: sandbox
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm_and_yarn:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci:no-issue-required

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: sandbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci:no-issue-required
