groups:
  - name: test-rules
    rules:
      # Test-only: always fires. Keep out of production-named groups.
      - alert: Test_Always_Firing
        expr: vector(1)
        for: 10s
        labels:
          severity: test
        annotations:
          summary: "Test alert that always fires"
          description: "Validates Prometheus → Alertmanager → Email. Disable in non-dev if noisy."

  - name: infra_alerts
    rules:
      # Requires: job=node-exporter (prom/node-exporter)
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 2 minutes on {{ $labels.instance }}."

      # Requires: job=node-exporter
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
          service: node-exporter
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 2 minutes on {{ $labels.instance }}."

      # Requires: job=node-exporter
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
          service: node-exporter
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Less than 10% free on {{ $labels.mountpoint }} ({{ $labels.instance }})."

      # Requires: job=mongodb-exporter (percona/mongodb_exporter)
      - alert: MongoDBDown
        expr: up{job="mongodb-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: mongo
        annotations:
          summary: "MongoDB exporter down on {{ $labels.instance }}"
          description: "mongodb-exporter target unreachable for over 1 minute (MongoDB likely down or scrape failed)."

      # Requires: job=postgres-exporter
      - alert: PostgreSQLDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL exporter down on {{ $labels.instance }}"
          description: "postgres-exporter target unreachable for over 1 minute."

      # Requires: job=mysql-exporter
      - alert: MySQLDown
        expr: up{job="mysql-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: mysql
        annotations:
          summary: "MySQL exporter down on {{ $labels.instance }}"
          description: "mysql-exporter target unreachable for over 1 minute."

      # Requires: job=blackbox-keycloak (blackbox http_2xx → keycloak:8080)
      - alert: KeycloakDown
        expr: probe_success{job="blackbox-keycloak"} == 0
        for: 1m
        labels:
          severity: critical
          service: keycloak
        annotations:
          summary: "Keycloak HTTP probe failed on {{ $labels.instance }}"
          description: "Blackbox http_2xx probe to Keycloak failed for over 1 minute."

      # Requires: job=redis-exporter
      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis exporter down on {{ $labels.instance }}"
          description: "redis-exporter target unreachable for over 1 minute."

      # Requires: job=blackbox-exporter
      - alert: BlackboxDown
        expr: up{job="blackbox-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: blackbox
        annotations:
          summary: "Blackbox Exporter down on {{ $labels.instance }}"
          description: "blackbox-exporter scrape target unreachable for over 1 minute."

      # Requires: job=blackbox-exporter-icmp-ping
      - alert: BlackboxICMPDown
        expr: probe_success{job="blackbox-exporter-icmp-ping"} == 0
        for: 1m
        labels:
          severity: critical
          service: blackbox-icmp
        annotations:
          summary: "Blackbox ICMP probe failed on {{ $labels.instance }}"
          description: "ICMP probe_success == 0 for over 1 minute."

  - name: rabbitmq_alerts
    rules:
      # Requires: job=rabbitmq-exporter
      - alert: RabbitMQQueueTooLarge
        expr: rabbitmq_queue_messages_ready{queue="alerts.queue"} > 20
        for: 2m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "Too many messages in queue: {{ $labels.queue }}"
          description: "Queue '{{ $labels.queue }}' has more than 20 ready messages for over 2 minutes."

      - alert: RabbitMQDown
        expr: rabbitmq_up == 0 or up{job="rabbitmq-exporter"} == 0
        for: 30s
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: "RabbitMQ is down on {{ $labels.instance }}"
          description: "rabbitmq_up == 0 or rabbitmq-exporter scrape failed for more than 30 seconds."

      - alert: RabbitMQConsumersZero
        expr: rabbitmq_queue_consumers{queue="alerts.queue"} == 0
        for: 30s
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: "No active consumers on queue {{ $labels.queue }}"
          description: "Queue '{{ $labels.queue }}' has no consumers for more than 30 seconds."
